<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Redirecting to Genesis Core Systems</title>
<!-- Legacy Squarespace slug. Google had /home indexed and it began returning 404
     once the domain moved to GitHub Pages. GitHub Pages has no server-side
     redirects, so this stub is the supported route: Google classes an INSTANT
     (0 second) meta refresh in the permanent-redirect bucket, which passes the
     canonicalisation signal. No `noindex` here on purpose, it would block the
     signal from flowing to the target. Keep this file indefinitely. -->
<link rel="canonical" href="https://genesiscoresystems.com/" />
<meta http-equiv="refresh" content="0; url=https://genesiscoresystems.com/" />
<script>location.replace("https://genesiscoresystems.com/");</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
       font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1B265F;padding:2rem;}
  a{color:#2F4DAB;}
</style>
</head>
<body>
  <main>
    <h1 style="font-size:1.25rem;margin:0 0 .5rem;">Redirecting</h1>
    <p style="margin:0;">This page has moved. <a href="https://genesiscoresystems.com/">Continue to Genesis Core Systems</a>.</p>
  </main>
</body>
</html>
